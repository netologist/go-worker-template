name: CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: default to read-only; write permissions granted strictly per-job.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  workflow-audit:
    name: GitHub Actions Static Analysis (actionlint & zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go for actionlint
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run zizmor security static analysis
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  validate-mocks:
    name: Mockery Validation & Drift Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate Mocks
        run: go tool mockery

      - name: Ensure mocks are in sync
        run: |
          if ! git diff --exit-code internal/gen/mocks; then
            echo "Error: Generated mocks are out of sync. Run 'mise run generate:mocks' and commit the changes."
            exit 1
          fi

  validate-sqlc:
    name: SQL Queries Validation & Drift Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate SQL Queries
        run: go tool sqlc generate

      - name: Ensure SQL queries are in sync
        run: |
          if ! git diff --exit-code internal/gen/sqlc; then
            echo "Error: Generated SQL code is out of sync. Run 'mise run generate:sqlc' and commit the changes."
            exit 1
          fi

  security:
    name: Security Checks (Secrets & Vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Gitleaks secret detection
        run: go tool gitleaks detect --verbose

      - name: Run Govulncheck vulnerability scanner
        run: go tool govulncheck ./...

  lint:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go imports formatting
        run: |
          UNFORMATTED=$(find . -type f -name '*.go' -not -name '*.gen.go' -not -path './vendor/*' -not -path './internal/gen/*' -exec go tool goimports -local github.com/netologist/go-worker-template -l {} +)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            echo "Run 'mise run format' to fix."
            exit 1
          fi

      - name: Run golangci-lint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go tool golangci-lint run --new-from-rev=origin/"$BASE_REF"
          else
            go tool golangci-lint run ./...
          fi

  test:
    name: Test & Race Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with gotestsum
        run: go tool gotestsum --format testname -- -race -covermode=atomic -coverprofile=coverage.out ./internal/... ./cmd/...

      - name: Upload test coverage artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  architecture:
    name: Hexagonal Architecture Boundary Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run architecture boundary tests
        run: go test -v ./tests/arch/...

  build-worker:
    name: Build, Scan & Push Worker Image
    runs-on: ubuntu-latest
    needs: [workflow-audit, validate-mocks, validate-sqlc, security, lint, test, architecture]
    permissions:
      contents: read
      packages: write
      id-token: write # required for Cosign keyless signing
    outputs:
      image_tag: ${{ steps.sha.outputs.image_tag }}
      image_digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Extract Docker metadata (immutable SHA tags only; never push on PR)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Build 1: Local daemon build for scanning and E2E artifact handoff. Never pushed.
      - name: Build Worker image locally (scratch target, unprivileged)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Resolve immutable SHA tag
        id: sha
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_REF=$(printf '%s\n' "$TAGS" | grep -m1 ':sha-')
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_REF##*:}" >> "$GITHUB_OUTPUT"

      # Tarball export removes the docker.sock mount requirement for Trivy scanning.
      - name: Export Worker image to tarball for rootless Trivy scan
        env:
          IMAGE_REF: ${{ steps.sha.outputs.image_ref }}
        run: docker save "$IMAGE_REF" -o /tmp/worker-image.tar

      # Pinned version + digest of Trivy; no docker.sock mount.
      - name: "Trivy Security Gate: Scan local image tarball"
        run: |
          docker run --rm \
            -v /tmp/worker-image.tar:/tmp/worker-image.tar:ro \
            ghcr.io/aquasecurity/trivy:0.60.0@sha256:91c3a842834563a6860dbaec5af7c1949df5caf988f9632ef5cbb0a5cd59d8f8 \
            image --input /tmp/worker-image.tar --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH

      - name: Upload image tarball for E2E runner
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: worker-image-tarball
          path: /tmp/worker-image.tar
          retention-days: 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build 2 & Push: Non-PR events push with full SLSA provenance and SBOM attestations.
      - name: Push verified Worker image with SBOM and provenance
        if: github.event_name != 'pull_request'
        id: build-push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker

      - name: Install Cosign for keyless signing
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign verified image digest with GitHub OIDC keyless identity
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          cosign sign --yes "${TARGET_IMAGE}@${DIGEST}"

  e2e:
    name: End-to-End Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [build-worker]
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ needs.build-worker.outputs.image_tag }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'S3cr3tP455w0rD' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Worker image tarball
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: worker-image-tarball
          path: /tmp

      - name: Load Worker image into local Docker daemon
        run: docker load -i /tmp/worker-image.tar

      - name: Build local support images (migration & E2E runner)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml build migration e2e

      - name: Run E2E test suite against verified Worker image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --no-build --abort-on-container-exit --exit-code-from e2e

      - name: Clean up Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  tag-latest:
    name: Promote Verified Worker Image to Latest
    runs-on: ubuntu-latest
    needs: [build-worker, e2e]
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push latest for verified Worker image
        env:
          IMAGE_TAG: ${{ needs.build-worker.outputs.image_tag }}
        run: |
          SRC="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          DST="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Promoting $SRC to $DST..."
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
