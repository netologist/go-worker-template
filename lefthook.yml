pre-commit:
  parallel: true
  commands:
    gitleaks:
      tags: security secrets
      run: go tool gitleaks git --pre-commit --staged --verbose
    goimports:
      tags: style
      glob: "*.go"
      exclude:
        - "internal/gen/**"
        - "vendor/**"
        - "**/*.gen.go"
      run: go tool goimports -local github.com/netologist/go-worker-template -w {staged_files}
      stage_fixed: true
    golangci-lint:
      tags: lint
      glob: "*.go"
      run: go tool golangci-lint run --new-from-rev=HEAD

pre-push:
  commands:
    unit-tests:
      tags: test
      run: go test -race -short ./internal/... ./cmd/...
    govulncheck:
      tags: security
      run: go tool govulncheck ./...
