[tools]
go = "1.27.2"

[env]
_.file = ".env"
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "S3cr3tP455w0rD"
POSTGRES_DB = "worker_db"
DATABASE_URL = "postgres://{{ env.POSTGRES_USER }}:{{ env.POSTGRES_PASSWORD }}@localhost:5432/{{ env.POSTGRES_DB }}?sslmode=disable"
GOOSE_DRIVER = "postgres"
GOOSE_MIGRATION_DIR = "./database/migrations"
GOOSE_DBSTRING = "{{ env.DATABASE_URL }}"

[tasks."dev"]
description = "Start PostgreSQL & RabbitMQ, run migrations, and run worker with live-reload (Air)"
depends = ["docker:compose-up", "migrate:up"]
run = "go tool air"

[tasks."lint"]
description = "Run golangci-lint on all packages"
run = "go tool golangci-lint run ./..."

[tasks."lint:fix"]
description = "Run golangci-lint with auto-fix"
run = "go tool golangci-lint run --fix ./..."

[tasks."format"]
description = "Format Go code with goimports (grouped with module prefix)"
run = "find . -type f -name '*.go' -not -name '*.gen.go' -not -path './vendor/*' -not -path './internal/gen/*' -exec go tool goimports -local github.com/netologist/go-worker-template -w {} +"

[tasks."secret:check"]
description = "Run Gitleaks to detect secrets"
run = "go tool gitleaks detect --no-git -v"

[tasks."hooks:install"]
description = "Install git hooks"
run = "go tool lefthook install"

[tasks."hooks:uninstall"]
description = "Uninstall git hooks"
run = "go tool lefthook uninstall"

[tasks."hooks:check"]
description = "Check git hooks"
run = "go tool lefthook validate"

[tasks."vuln"]
description = "Check for known security vulnerabilities with govulncheck"
run = "go tool govulncheck ./..."

[tasks."test:arch"]
description = "Run architectural boundary tests"
run = "go test -v ./tests/arch/..."

[tasks."test"]
description = "Run unit, usecase, and architectural tests with gotestsum"
run = "go tool gotestsum --format testname -- -race ./internal/... ./cmd/... ./tests/arch/..."

[tasks."test:coverage"]
description = "Run unit tests with race detection and show function-level coverage"
run = "go tool gotestsum --format testname -- -race -covermode=atomic -coverprofile=coverage.out $(go list ./internal/... | grep -v '/internal/gen') && go tool cover -func=coverage.out"

[tasks."test:coverage:html"]
description = "Run unit tests and open interactive HTML coverage report"
run = "go tool gotestsum --format testname -- -race -covermode=atomic -coverprofile=coverage.out $(go list ./internal/... | grep -v '/internal/gen') && go tool cover -html=coverage.out"

[tasks."test:mutation"]
description = "Run mutation testing on domain layer using gremlins"
run = "go tool gremlins unleash --timeout-coefficient 30 ./internal/domain"

[tasks."test:e2e"]
description = "Start dependencies, apply migrations, run the worker locally and execute E2E probe suite"
run = [
  { task = "docker:compose-up" },
  { task = "migrate:up" },
  '''
BIN_DIR=$(mktemp -d)
go build -o "$BIN_DIR/worker" ./cmd/worker
"$BIN_DIR/worker" &
WORKER_PID=$!
trap 'kill "$WORKER_PID" 2>/dev/null; rm -rf "$BIN_DIR"' EXIT
go test -v -count=1 ./tests/e2e/...
  ''',
]

[tasks."generate:sqlc"]
description = "Generate Go code from SQL queries with sqlc"
run = "go tool sqlc generate"

[tasks."generate:mocks"]
description = "Generate mocks with mockery"
alias = "mocks:generate"
run = "go tool mockery"
sources = [".mockery.yaml", "internal/**/*.go"]
outputs = ["internal/gen/mocks/**/*.go"]

[tasks."mocks:clean"]
description = "Remove generated mocks"
run = "rm -rf internal/gen/mocks"

[tasks."mocks:check"]
description = "Fail if generated mocks are out of date (for CI)"
depends = ["generate:mocks"]
run = "git diff --exit-code -- internal/gen/mocks"

[tasks."generate"]
description = "Run all code generators (SQL queries, Mocks)"
depends = ["generate:sqlc", "generate:mocks"]

[tasks."migrate:up"]
description = "Apply database migrations with Goose"
run = "go tool goose up"

[tasks."migrate:down"]
description = "Rollback the latest database migration"
run = "go tool goose down"

[tasks."migrate:status"]
description = "View database migration status"
run = "go tool goose status"

[tasks."docker:build"]
description = "Build scratch production container"
run = "docker build --target production -t go-worker-template:latest ."

[tasks."docker:compose-up"]
description = "Start local dependencies (PostgreSQL, RabbitMQ) using Docker Compose"
run = "docker compose up -d --wait"

[tasks."docker:compose-down"]
description = "Stop and clean local dependencies using Docker Compose"
run = "docker compose down -v"

[tasks.psql]
run = "docker compose exec postgres psql -U postgres -d worker_db"

[tasks."template:init"]
description = "Initialize project with a new module name (usage: mise run template:init <new-module-path>)"
run = '''
#!/usr/bin/env bash
NEW_MODULE="$1"
if [ -z "$NEW_MODULE" ]; then
  echo "Error: Missing new module path."
  echo "Usage:   mise run template:init <new-module-path>"
  echo "Example: mise run template:init github.com/my-org/my-worker"
  exit 1
fi
OLD_MODULE="github.com/netologist/go-worker-template"
echo "Initializing template from $OLD_MODULE to $NEW_MODULE..."

go mod edit -module "$NEW_MODULE"

find . \
  -type f \
  \( -name '*.go' -o -name '*.yaml' -o -name '*.yml' -o -name '*.toml' -o -name 'Dockerfile*' \) \
  -not -path './.git/*' \
  -not -path './vendor/*' \
  -exec perl -i -pe '
    BEGIN {
      $old = $ENV{"OLD_MODULE"};
      $new = $ENV{"NEW_MODULE"};
    }
    s/\Q$old\E/$new/g;
  ' {} +

echo "Regenerating code..."
mise run generate

echo "Formatting imports..."
mise run format

echo "Running tests to verify..."
mise run test

echo "Successfully initialized template for $NEW_MODULE!"
'''

[tasks."docs:build"]
description = "Build documentation site with MkDocs"
run = "which uv >/dev/null 2>&1 && uv run --with-requirements requirements-docs.txt mkdocs build --strict || python3 -m mkdocs build --strict"

[tasks."docs:serve"]
description = "Serve documentation site locally with live-reload"
run = "which uv >/dev/null 2>&1 && uv run --with-requirements requirements-docs.txt mkdocs serve || python3 -m mkdocs serve"
